name: Update and release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      # Exercise workflow edits too; the tag/release check makes repeat
      # runs a no-op until either the version or upstream changes.
      - .github/workflows/release.yml
  schedule:
    # Check upstream once a day (04:17 UTC).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git nodejs python hyprcursor github-cli

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The job container runs as root, but the mounted workspace is owned by
      # the runner user. Without this, git refuses to write to the repository.
      - name: Trust workspace for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/MacTahoe-icon-theme"

      - name: Check upstream revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream/MacTahoe-icon-theme fetch --quiet origin main
          git -C upstream/MacTahoe-icon-theme checkout --quiet --detach FETCH_HEAD

          revision="$(git -C upstream/MacTahoe-icon-theme rev-parse HEAD)"
          tag="v$(cat VERSION)-${revision:0:12}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Publish only once per upstream revision. Requiring both the tag and
          # the release means a run that tagged but failed to publish retries
          # instead of being skipped forever.
          has_tag=false
          has_release=false
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 && has_tag=true
          gh release view "$tag" >/dev/null 2>&1 && has_release=true

          if [ "$has_tag" = true ] && [ "$has_release" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Upstream $revision is already published as $tag; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Upstream $revision is not fully published yet (tag=$has_tag, release=$has_release); building $tag."
          fi

      - name: Commit upstream submodule pointer
        if: steps.upstream.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          revision="${{ steps.upstream.outputs.revision }}"
          current="$(git ls-tree HEAD -- upstream/MacTahoe-icon-theme | awk '{print $3}')"
          if [ "$current" = "$revision" ]; then
            echo "Submodule pointer already records $revision."
            exit 0
          fi

          git add upstream/MacTahoe-icon-theme
          git commit -m "Update upstream to ${revision:0:12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build and validate both themes
        if: steps.upstream.outputs.skip != 'true'
        run: python scripts/build.py --no-fetch

      - name: Verify reproducible archives
        if: steps.upstream.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.tar.gz > /tmp/archives.sha256
          python scripts/build.py --no-fetch
          sha256sum --check /tmp/archives.sha256

      - name: Create tag and publish release
        if: steps.upstream.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          revision="${{ steps.upstream.outputs.revision }}"
          version="$(cat VERSION)"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; reusing it."
          else
            git tag -a "$tag" -m "MacTahoe Hyprcursor $version (upstream ${revision:0:12})"
            git push origin "refs/tags/$tag"
          fi

          {
            echo "Automated Hyprcursor conversion of the MacTahoe cursor theme."
            echo
            echo "- Upstream: https://github.com/vinceliuice/MacTahoe-icon-theme"
            echo "- Upstream commit: \`$revision\`"
            echo "- Project version: \`$version\`"
            echo "- Variants: \`MacTahoe-hyprcursor\` (light), \`MacTahoe-dark-hyprcursor\` (dark)"
            echo
            echo "Generated assets are not committed; releases are the distribution mechanism."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            (cd dist && sha256sum ./*.tar.gz)
            echo '```'
          } > /tmp/release-notes.md

          gh release create "$tag" dist/*.tar.gz \
            --verify-tag \
            --title "MacTahoe Hyprcursor $version (${revision:0:7})" \
            --notes-file /tmp/release-notes.md
